<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Flipping Card</title>
    <style>
      body {
        background-color: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui sans-serif;
      }
      .card-container {
        width: 300px;
        height: 400px;
        perspective: 1000px;
      }
      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        cursor: pointer;
        transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-container:hover .card {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }
      .card-front {
        background: linear-gradient(145deg, #1e1b4b, #0f172a);
        color: #ffffff;
      }
      .card-back {
        background: linear-gradient(145deg, #431407, #0f172a);
        color: #ffffff;
        transform: rotateY(180deg);
      }
      .badge {
        padding: 6px 16px;
        background: #6366f1;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-top: 16px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 15px #6366f1;
        }
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <div class="card-front">
          <h2 style="font-size: 1.8rem">SoundWave Pro</h2>
          <p style="color: #a5b4fc; margin-top: 8px">Studio Edition</p>
          <span class="badge">Hover to inspect</span>
        </div>
        <div class="card-back">
          <h3>Specifications</h3>
          <p
            style="
              color: #cbd5e1;
              font-size: 0.95rem;
              margin-top: 12px;
              text-align: center;
            "
          >
            24-bit/192khz Spateial Audio support with real-time losseless
            processing
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
